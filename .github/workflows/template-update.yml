---
name: "Template update"

# Opens a pull request with the newest ha-dev-environment release applied by
# `copier update`. Each new release replaces the previous open pull request:
# the old one is closed and its branch deleted, so only one stays open.
# Conflicts are not blocking: the pull request is opened with the conflict
# markers in place, and its body lists the files to resolve.
# Pull requests that come from this workflow are identified by their branch
# name, `template-update/<tag>`.

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: "template-update"
  cancel-in-progress: false

jobs:
  template-update:
    name: "template-update"
    runs-on: "ubuntu-latest"
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: "actions/checkout@v7"
        with:
          fetch-depth: 0

      - uses: "astral-sh/setup-uv@v7"

      # --quiet: exit status 2 means a newer template version exists.
      - name: "Check for a newer template version"
        id: check
        run: |
          status=0
          uvx --from copier copier check-update --quiet || status=$?
          case "$status" in
            0) echo "newer=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "newer=true" >> "$GITHUB_OUTPUT" ;;
            *) exit "$status" ;;
          esac

      - name: "Find the newest release"
        if: steps.check.outputs.newer == 'true'
        id: release
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          source_url="$(sed -n 's/^_src_path: //p' .copier-answers.yml)"
          source_url="$(echo "$source_url" | sed -E 's#^gh:#https://github.com/#')"
          tag="$(git ls-remote --tags --refs --sort='-v:refname' "$source_url" 'v*' | head -n 1 | sed 's#.*refs/tags/##')"
          [ -n "$tag" ] || { echo "::error::No release tag found in $source_url"; exit 1; }
          branch="template-update/$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            echo "::notice::Branch $branch already exists: its pull request was already opened."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: "Apply the release"
        if: steps.check.outputs.newer == 'true' && steps.release.outputs.exists == 'false'
        id: update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${{ steps.release.outputs.branch }}"
          # --defaults: no new variables are expected; a new one would take its default.
          uvx --from copier copier update --defaults --trust --vcs-ref "${{ steps.release.outputs.tag }}" \
            || echo "::warning::copier update exited with an error; check the files in the pull request."
          git add -A
          if git diff --cached --quiet; then
            echo "::notice::Nothing to apply for ${{ steps.release.outputs.tag }}."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: update template to ${{ steps.release.outputs.tag }}"
          conflicts="$(git grep -l -E '^(<<<<<<<|>>>>>>>) ' -- . || true)"
          {
            echo "conflicts<<EOF"
            echo "$conflicts"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: "Open the pull request"
        if: steps.update.outputs.changed == 'true'
        id: pr
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          git push -u origin "${{ steps.release.outputs.branch }}"
          body="$(mktemp)"
          {
            echo "## Summary"
            echo ""
            echo "Applies the ha-dev-environment release \`${{ steps.release.outputs.tag }}\` with \`copier update\`."
            echo ""
            if [ -n "${{ steps.update.outputs.conflicts }}" ]; then
              echo "## Conflicts"
              echo ""
              echo "These files contain conflict markers to resolve before merging:"
              echo ""
              echo "${{ steps.update.outputs.conflicts }}" | sed 's/^/- `/; s/$/`/'
              echo ""
            fi
            echo "## Review"
            echo ""
            echo "- Read the diff, resolve any conflict, run \`scripts/lint\` and \`scripts/test\`."
            echo "- A newer release replaces this pull request automatically."
          } > "$body"
          url="$(gh pr create --base develop --head "${{ steps.release.outputs.branch }}" \
            --title "chore: update template to ${{ steps.release.outputs.tag }}" \
            --body-file "$body")"
          echo "number=${url##*/}" >> "$GITHUB_OUTPUT"

      - name: "Close the previous template pull requests"
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          gh pr list --state open --json number,headRefName --jq '.[] | select(.headRefName | startswith("template-update/")) | .number' \
            | while read -r number; do
                [ "$number" = "${{ steps.pr.outputs.number }}" ] && continue
                gh pr close "$number" --delete-branch \
                  --comment "Replaced by #${{ steps.pr.outputs.number }} (${{ steps.release.outputs.tag }})."
              done
